name: Deploy VibeRotor to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != true ]; then
            echo "::notice::Pages is disabled. The site will build but will not deploy."
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package corresponding source
        run: |
          git archive --format=tar.gz --prefix=viberotor/ \
            --output=dist/viberotor-source.tar.gz HEAD -- \
            README.md index.html favicon.ico package.json package-lock.json js ui scripts \
            third_party/Xrotor/src third_party/Xrotor/runs third_party/libf2c wasm
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && needs.build.outputs.pages-enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
